name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned dev tooling
        run: npm ci --ignore-scripts

      - name: Lint Claude Code configuration
        run: npx claudelint --no-cache --format github

      - name: Report findings
        if: always()
        run: |
          {
            echo "### claudelint"
            echo
            echo '```'
            npx claudelint --no-cache --format compact --no-color || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifests
        run: claude plugin validate . --strict

  release:
    needs: [lint, validate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Manage release PR / tag release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
